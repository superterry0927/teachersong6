<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026教師節-我的主打歌6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
            background: linear-gradient(135deg, #111 0%, #2a2a2a 100%);
        }

        /* Walkman Device Styling */
        .walkman-body {
            background: linear-gradient(145deg, #2c2c2c, #1a1a1a);
            box-shadow: 
                15px 15px 40px rgba(0,0,0,0.9), 
                inset -3px -3px 10px rgba(0,0,0,0.8), 
                inset 3px 3px 10px rgba(255,255,255,0.1);
            border: 1px solid #444;
        }

        .tape-window {
            background: radial-gradient(circle, #222 0%, #000 100%);
            box-shadow: inset 0 0 30px #000, 0 5px 15px rgba(0,0,0,0.5);
            border: 2px solid #111;
        }

        /* Spinning Record / Cover Art Animation */
        .cover-art {
            animation: spin 6s linear infinite;
            animation-play-state: paused;
            box-shadow: 0 0 25px rgba(0,0,0,0.9), 0 0 0 4px #1a1a1a;
        }
        
        @keyframes spin { 
            100% { transform: rotate(360deg); } 
        }

        /* Lyrics Container with Native Scrolling & Masking */
        .lyrics-wrapper {
            background-color: rgba(0, 0, 0, 0.2);
            box-shadow: inset 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.05);
            overflow-y: auto;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            -ms-overflow-style: none;  
            scrollbar-width: none;  
        }

        .lyrics-wrapper::-webkit-scrollbar { 
            display: none; 
        }

        .lyrics-container {
            padding: 10vh 0; /* 縮小上下間距，因為不需要強制置中 */
        }

        .lyric-line {
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.3s ease;
        }

        /* Active Lyric KTV Glowing Effect */
        .lyric-line.active {
            color: #00a8ff; 
            text-shadow: 0px 0px 12px rgba(0, 168, 255, 0.8), 0px 0px 2px rgba(255, 255, 255, 0.5);
            transform: scale(1.02); /* Slight pop to emphasize the active line */
        }

        /* Progress Bar Styling */
        input[type=range] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: #ff5e3a;
            cursor: pointer;
            margin-top: -5px;
            box-shadow: 0 0 8px rgba(255, 94, 58, 0.8);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        /* Hardware Buttons */
        .control-btn {
            box-shadow: 0px 6px 0px #111, 0px 10px 15px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }
        
        .control-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0px 0px 0px #111, 0px 2px 5px rgba(0,0,0,0.5);
        }

        .control-btn:disabled {
            filter: grayscale(100%) opacity(0.5);
            cursor: not-allowed;
            box-shadow: 0px 6px 0px #111;
        }
        
        #play-btn { background: linear-gradient(145deg, #ff5e3a, #e03a16); }
        #stop-btn { background: linear-gradient(145deg, #666, #444); }
    </style>
</head>
<body class="flex justify-center items-center h-screen w-screen m-0">

    <div class="walkman-body w-[90vw] max-w-[450px] h-[90vh] max-h-[850px] p-6 rounded-[30px] flex flex-col box-border relative">
        
        <div class="brand-text text-center text-sm font-black text-gray-400 mb-5 tracking-[4px] uppercase">
            我的主題曲 Player
        </div>
        
        <div class="tape-window flex-none h-[35%] rounded-2xl flex justify-center items-center overflow-hidden relative mb-5">
            <div class="loading-text absolute text-gray-400 font-bold text-sm z-10" id="status-text">載入中...</div>
            <img src="" alt="Cover Art" class="cover-art w-40 h-40 rounded-full object-cover z-20 hidden border-4 border-gray-900" id="cover">
            <!-- Decorative center hole for the vinyl look -->
            <div class="absolute w-4 h-4 bg-gray-900 rounded-full z-30 shadow-inner"></div>
        </div>

        <!-- Dynamic Lyrics Area -->
        <div class="lyrics-wrapper flex-1 rounded-xl relative" id="lyrics-wrapper">
            <div class="lyrics-container w-full text-center" id="lyrics-container">
                <!-- Lyrics will be generated here -->
            </div>
        </div>
        
        <!-- Progress Bar -->
        <div class="flex items-center w-full px-2 mt-4 mb-2">
            <span id="current-time" class="text-xs text-gray-400 w-10 text-right mr-2 font-mono">0:00</span>
            <input type="range" id="progress-bar" class="flex-1" value="0" step="0.1">
            <span id="duration-time" class="text-xs text-gray-400 w-10 ml-2 font-mono">0:00</span>
        </div>

        <div class="controls flex justify-between px-2 mt-2">
            <audio id="audio-player" preload="auto"></audio>
            
            <button id="play-btn" class="control-btn w-[46%] h-[60px] rounded-xl border-none font-black text-lg tracking-widest text-white cursor-pointer outline-none" disabled>PLAY</button>
            <button id="stop-btn" class="control-btn w-[46%] h-[60px] rounded-xl border-none font-black text-lg tracking-widest text-white cursor-pointer outline-none" disabled>STOP</button>
        </div>

        <div id="error-msg" class="text-[#ff471a] text-center text-sm mt-4 font-bold hidden">
            找不到對應的資料。
        </div>
    </div>

    <script>
        const mediaDatabase = {
            "1": {
                coverUrl: "https://picsum.photos/400/400?random=1", 
                audioUrl: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
                lrc: `
[00:00.00] 準備播放：我的主題曲
[00:05.00] 這次，字體不會再放大了
[00:10.50] 而是呈現清楚的KTV亮藍色與發光感
[00:15.20] 你可以試著用滑鼠(或手指)上下拖曳這段歌詞
[00:20.00] 音樂會超級滑順地跟著你的拖曳來快轉或倒轉
[00:25.50] 這就是頂級音樂App的操作體驗
[00:30.00] 放開手指後，系統會自動接手捲動
[00:35.00] 享受這段專屬於你的旋律
                `
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('id') || '1'; 

            const audio = document.getElementById('audio-player');
            const cover = document.getElementById('cover');
            const playBtn = document.getElementById('play-btn');
            const stopBtn = document.getElementById('stop-btn');
            const statusText = document.getElementById('status-text');
            const lyricsContainer = document.getElementById('lyrics-container');
            const lyricsWrapper = document.getElementById('lyrics-wrapper');
            
            const progressBar = document.getElementById('progress-bar');
            const currentTimeEl = document.getElementById('current-time');
            const durationTimeEl = document.getElementById('duration-time');

            let isAudioLoaded = false;
            let parsedLyrics = []; 
            let currentLyricIndex = -1; 
            let hasAttemptedAutoplay = false;

            // 輔助函式：時間格式化為 MM:SS
            function formatTime(timeInSeconds) {
                if (isNaN(timeInSeconds)) return "0:00";
                const minutes = Math.floor(timeInSeconds / 60);
                const seconds = Math.floor(timeInSeconds % 60);
                return `${minutes}:${seconds.toString().padStart(2, '0')}`;
            }

            function parseLRC(lrcString) {
                const lines = lrcString.split('\n');
                const result = [];
                const timeReg = /\[(\d{2}):(\d{2})\.(\d{2,3})\]/;
                
                for (let line of lines) {
                    const match = line.match(timeReg);
                    if (match) {
                        const min = parseInt(match[1]);
                        const sec = parseInt(match[2]);
                        const ms = parseInt(match[3].padEnd(3, '0')); 
                        const time = min * 60 + sec + ms / 1000;
                        const text = line.replace(timeReg, '').trim();
                        if (text) {
                            result.push({ time: time, text: text });
                        }
                    }
                }
                return result;
            }

            function renderLyrics(lyrics) {
                lyricsContainer.innerHTML = ''; 
                lyrics.forEach((lyric, index) => {
                    const div = document.createElement('div');
                    div.className = 'lyric-line py-3 px-4 text-base text-gray-500 font-medium min-h-[20px]';
                    div.id = `lyric-${index}`;
                    div.innerText = lyric.text;
                    lyricsContainer.appendChild(div);
                });
            }

            function attemptAutoplay() {
                if (hasAttemptedAutoplay) return;
                hasAttemptedAutoplay = true;

                audio.play().then(() => {
                    cover.style.animationPlayState = 'running';
                    statusText.style.display = 'none';
                }).catch(error => {
                    console.warn("Autoplay prevented by browser:", error);
                    statusText.innerText = "請點擊 PLAY 播放";
                    statusText.style.display = 'block';
                });
            }

            if (mediaDatabase[userId] && mediaDatabase[userId].audioUrl !== "") {
                const userData = mediaDatabase[userId];
                cover.src = userData.coverUrl;
                audio.src = userData.audioUrl;

                if (userData.lrc) {
                    parsedLyrics = parseLRC(userData.lrc);
                    renderLyrics(parsedLyrics);
                } else {
                    lyricsContainer.innerHTML = '<div class="lyric-line text-gray-500 py-3">無歌詞資料</div>';
                }

                cover.onload = () => {
                    cover.style.display = 'block';
                    if (!hasAttemptedAutoplay) {
                        statusText.style.display = 'none';
                    }
                    if(isAudioLoaded) {
                        playBtn.disabled = false;
                        stopBtn.disabled = false;
                        attemptAutoplay();
                    }
                };

                audio.oncanplay = () => {
                    if (!isAudioLoaded) {
                        isAudioLoaded = true;
                        if (cover.style.display === 'block') {
                            playBtn.disabled = false;
                            stopBtn.disabled = false;
                            attemptAutoplay();
                        }
                    }
                };

                // 當獲取音軌長度時，設定進度條最大值
                audio.addEventListener('loadedmetadata', () => {
                    progressBar.max = audio.duration;
                    durationTimeEl.innerText = formatTime(audio.duration);
                });
            }

            // 進度條滑動與跳轉邏輯
            let isScrubbing = false;

            progressBar.addEventListener('input', () => {
                isScrubbing = true;
                currentTimeEl.innerText = formatTime(progressBar.value);
            });

            progressBar.addEventListener('change', () => {
                audio.currentTime = progressBar.value;
                isScrubbing = false;
            });

            // 音樂時間更新邏輯
            audio.addEventListener('timeupdate', () => {
                // 如果使用者沒有在拖曳進度條，自動更新進度條數值
                if (!isScrubbing) {
                    progressBar.value = audio.currentTime;
                    currentTimeEl.innerText = formatTime(audio.currentTime);
                }

                if (parsedLyrics.length === 0) return;
                
                const currentTime = audio.currentTime;
                let newIndex = parsedLyrics.findIndex((lyric, index) => {
                    const nextTime = parsedLyrics[index + 1] ? parsedLyrics[index + 1].time : Infinity;
                    return currentTime >= lyric.time && currentTime < nextTime;
                });

                if (newIndex !== -1 && newIndex !== currentLyricIndex) {
                    if (currentLyricIndex !== -1) {
                        const oldElement = document.getElementById(`lyric-${currentLyricIndex}`);
                        if (oldElement) oldElement.classList.remove('active');
                    }
                    
                    const newElement = document.getElementById(`lyric-${newIndex}`);
                    if (newElement) {
                        newElement.classList.add('active');
                        // 自動滾動邏輯已移除，讓使用者自由瀏覽
                    }
                    currentLyricIndex = newIndex;
                }
            });

            playBtn.addEventListener('click', () => {
                audio.play().then(() => {
                    cover.style.animationPlayState = 'running';
                    statusText.style.display = 'none';
                }).catch(error => console.log(error));
            });

            stopBtn.addEventListener('click', () => {
                audio.pause();
                cover.style.animationPlayState = 'paused';
            });
            
            audio.addEventListener('ended', () => {
                cover.style.animationPlayState = 'paused';
            });
        });
    </script>
</body>
</html>
